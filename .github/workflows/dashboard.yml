name: Atualiza dashboard (Leads2b)

# Roda de 15 em 15 min (o GitHub pode atrasar alguns min em horario de pico)
# e tambem da pra rodar na mao pelo botao "Run workflow".
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # deixa o robo commitar o dados.json

concurrency:
  group: build-dashboard
  cancel-in-progress: false   # ENFILEIRA (nao mata o build em andamento) — B4 lento faz build durar ~7min

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install requests

      - name: Gera dados.json
        env:
          LEADS2B_TOKEN: ${{ secrets.LEADS2B_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # opcional (liga a IA das reunioes)
          B4_KEY_LARATAX: ${{ secrets.B4_KEY_LARATAX }}         # vendas = contrato assinado no B4 (jun/2026+)
          B4_KEY_LARAFY: ${{ secrets.B4_KEY_LARAFY }}
          MONTHS_BACK: "12"     # janela rolante de 12 meses (rapido). Historico completo = pesado.
        run: python build_dashboard.py

      - name: Raiz redireciona pro painel ao vivo (auto-cura)
        run: |
          printf '%s' '<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Comercial - LaraFy</title><meta http-equiv="refresh" content="0; url=./painel.html"><link rel="canonical" href="./painel.html"><script>location.replace("./painel.html"+location.search+location.hash)</script><style>html,body{margin:0;height:100%;background:#0b1220;color:#e5e7eb;font-family:system-ui,Segoe UI,sans-serif;display:flex;align-items:center;justify-content:center}</style></head><body><p>Abrindo o painel ao vivo... <a href="./painel.html" style="color:#22d3ee">clique aqui</a> se nao for automatico.</p></body></html>' > index.html

      - name: Commit se mudou
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dados.json index.html
          if git diff --cached --quiet; then
            echo "nada mudou"; exit 0
          fi
          git commit -m "dados: atualiza + raiz->painel [skip ci]"
          # push resiliente: outro processo pode ter empurrado antes (corrida) -> rebase e tenta.
          # -X theirs mantem NOSSAS versoes (dados.json novo + index redirect) no conflito.
          for i in $(seq 1 6); do
            if git push origin HEAD:main; then echo "push ok ($i)"; exit 0; fi
            echo "push perdeu a corrida, rebase e tenta de novo ($i/6)"
            git fetch origin main
            git rebase -X theirs origin/main || git rebase --abort
            sleep $((RANDOM % 6 + 3))
          done
          echo "nao conseguiu push apos 6 tentativas"; exit 1
